# News, newest first on the site. One entry per item:
#   date:  "YYYY-MM-DD", "YYYY-MM" or "YYYY" (quoted). Shown as "3 October 2025",
#          "May 2023" or "2023"; sorted as text, so keep the year-first form.
#          Ties keep the order of this file.
#   text:  Markdown (links, emphasis) and inline HTML both work.
#   link:  optional — a blog post for the long version, or any URL.
#          Rendered as "Read more ›" after the text.
#
# Paper announcements below were written from publications.bib (HAL); the date is
# the publication month HAL records.
- date: "2026-07"
  text: "Very happy that **“[EXADPrinter: Semi-Exhaustive Permissionless Device Fingerprinting Within the Android Ecosystem](https://inria.hal.science/hal-05585898v1)”**, written with Sihem Bouhenniche and Pierre Laperdrix, was accepted at PETS 2026 in Calgary."
- date: "2026-07"
  text: "The journal version of **DrawnApart** is out: “[A Device Identification and Spoofing Detection Technique Based on Remote GPU Fingerprinting](https://inria.hal.science/hal-05701262v1)”, with Tomer Laor, Naif Mehanna, Antonin Durey, Vitaly Dyadyuk, Pierre Laperdrix, Clémentine Maurice, Yossi Oren, Romain Rouvoy and Yuval Yarom, in ACM Transactions on Privacy and Security."
- date: "2025-04"
  text: "Proud that our paper **“[FP-Rainbow: Fingerprint-Based Browser Configuration Identification](https://inria.hal.science/hal-04932081v1)”**, written with Maxime Huyghe and Clément Quinton, was accepted at WWW 2025 in Sydney."
- date: "2022-04"
  text: "Our paper **“[The Price to Play: a Privacy Analysis of Free and Paid Games in the Android Ecosystem](https://inria.hal.science/hal-03559973v1)”**, with Pierre Laperdrix, Naif Mehanna and Antonin Durey, was accepted at the ACM Web Conference 2022 in Lyon — free games come with a hidden price."
- date: "2022-02"
  text: "Very proud that **“[DrawnApart: A Device Identification Technique based on Remote GPU Fingerprinting](https://inria.hal.science/hal-03526240v1)”** was accepted at NDSS 2022. A joint work with Tomer Laor, Naif Mehanna, Antonin Durey, Vitaly Dyadyuk, Pierre Laperdrix, Clémentine Maurice, Yossi Oren, Romain Rouvoy and Yuval Yarom — see also the [explainer on the Am I Unique blog](https://blog.amiunique.org/an-explicative-article-on-drawnapart-a-gpu-fingerprinting-technique/)."
- date: "2021-07"
  text: "Happy to announce that **“[FP-Redemption: Studying Browser Fingerprinting Adoption for the Sake of Web Security](https://inria.hal.science/hal-03212726v1)”**, written with Antonin Durey, Pierre Laperdrix and Romain Rouvoy, was accepted at DIMVA 2021."
- date: "2020-02"
  text: "**“[FP-Crawlers: Studying the Resilience of Browser Fingerprinting to Block Crawlers](https://inria.hal.science/hal-02441653v1)”**, with Antoine Vastel, Romain Rouvoy and Xavier Blanc, was accepted at MADWeb 2020, the NDSS workshop on measurements, attacks and defenses for the Web."
- date: "2018-08"
  text: "Very proud that our paper **“[FP-Scanner: The Privacy Implications of Browser Fingerprint Inconsistencies](https://inria.hal.science/hal-01820197v1)”**, written with Antoine Vastel, Pierre Laperdrix and Romain Rouvoy, was accepted at USENIX Security 2018 in Baltimore."
- date: "2018-05"
  text: "Delighted that **“[FP-Stalker: Tracking Browser Fingerprint Evolutions](https://inria.hal.science/hal-01652021v1)”**, written with Antoine Vastel, Pierre Laperdrix and Romain Rouvoy, was accepted at the IEEE Symposium on Security and Privacy (S&P 2018) in San Francisco."
- date: "2018-04"
  text: "**“[FP-Tester: Automated Testing of Browser Fingerprint Resilience](https://inria.hal.science/hal-01717158v1)”**, with Antoine Vastel and Romain Rouvoy, was accepted at IWPE 2018, the International Workshop on Privacy Engineering, in London."
- date: "2016-05"
  text: "Very proud that our paper **“[Beauty and the Beast: Diverting modern web browsers to build unique browser fingerprints](https://inria.hal.science/hal-01285470v2)”**, written with Pierre Laperdrix and Benoit Baudry, was accepted at the IEEE Symposium on Security and Privacy (S&P 2016) in San Jose."
- date: "2015-05"
  text: "Happy that **“[Mitigating browser fingerprint tracking: multi-level reconfiguration and diversification](https://inria.hal.science/hal-01121108v1)”** — the *Blink* paper on fingerprint randomisation with virtual machines — written with Pierre Laperdrix and Benoit Baudry, was accepted at SEAMS 2015 in Florence."
