# Build with one pinned Hugo binary, enforce the URL contract, deploy to Pages.
# No npm, gem or Python (CLAUDE.md rule 2). check-urls.sh is a gate: a build that
# drops a URL the old site served fails before it deploys.
name: Deploy Hugo site to Pages

on:
  push:
    branches: [hugo-site]     # rename here if the branch becomes the default
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0      # matches the author's local binary; bump both together

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -o "${RUNNER_TEMP}/hugo.deb" "$url"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: URL contract
        run: ./check-urls.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
